# This uses OIDC Trusted Publishing: https://docs.npmjs.com/trusted-publishers

name: Publish package on npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for pushing build commit and updating tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  check-package-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Get package version from NPM registry
        id: npm_version
        run: |
          # Try to get the version from npm, but handle case where package doesn't exist yet
          NPM_VERSION=$(npm view @stellarwp/changelogger version 2>/dev/null || echo "0.0.0")
          echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
          echo "NPM registry version: $NPM_VERSION"

      - name: Get package version from package.json
        id: package_version
        run: |
          PACKAGE_VERSION=$(jq -r .version ./package.json)
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Package.json version: $PACKAGE_VERSION"

      - name: Compare versions using semver
        run: |
          NPM_VERSION="${{ steps.npm_version.outputs.npm_version }}"
          PACKAGE_VERSION="${{ steps.package_version.outputs.package_version }}"

          echo "Comparing versions:"
          echo "  NPM registry: $NPM_VERSION"
          echo "  package.json: $PACKAGE_VERSION"

          # Use npx semver to check if package version is greater than npm version
          if npx semver "$PACKAGE_VERSION" -r ">$NPM_VERSION" > /dev/null 2>&1; then
            echo "✓ Package version ($PACKAGE_VERSION) is greater than NPM registry version ($NPM_VERSION)"
          else
            echo "✗ Package version ($PACKAGE_VERSION) is not greater than NPM registry version ($NPM_VERSION)"
            echo "Please bump the version in package.json before publishing."
            exit 1
          fi

  build-and-commit:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Commit built files to main
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ ':(exclude)dist/gha/**/*.d.ts' ':(exclude)dist/gha/**/*.d.ts.map'
          git commit -m "Build for ${TAG_NAME}" || (echo "NO_CHANGES=yes" >> $GITHUB_ENV && echo "No changes to commit")

      - name: Push built files to main
        if: ${{ env.NO_CHANGES != 'yes' }}
        run: git push origin main

      - name: Update release tag
        if: ${{ env.NO_CHANGES != 'yes' }}
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update the tag ref to point at the new commit (with dist/)
          # Using the API preserves the Release association since the tag name never disappears
          gh api "repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" \
            --method PATCH \
            --field sha="$(git rev-parse HEAD)" \
            --field force=true

      # Support for floating version tags (e.g., @v1, @v2, @v3, etc.)
      - name: Update floating version tag
        if: ${{ env.NO_CHANGES != 'yes' }}
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(echo "${TAG_NAME}" | grep -oP '^v?\K[0-9]+')
          if [ -n "$MAJOR" ]; then
            # Create or update the major version tag via the API
            gh api "repos/${{ github.repository }}/git/refs/tags/v${MAJOR}" \
              --method PATCH \
              --field sha="$(git rev-parse HEAD)" \
              --field force=true 2>/dev/null || \
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              --field ref="refs/tags/v${MAJOR}" \
              --field sha="$(git rev-parse HEAD)"
          fi

  publish-npm:
    needs: [build, check-package-version, build-and-commit]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check-package-version.result == 'success' && (needs.build-and-commit.result == 'success' || needs.build-and-commit.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # We need to use npm >=11.5.1 for OIDC trusted publishing.
      # Using Node LTS for publishing to ensure we have a modern npm version
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npm ci

      # npm >=11.5.1 automatically supports OIDC trusted publishing.
      - name: Publish package to NPM
        run: npm publish --verbose --access public
